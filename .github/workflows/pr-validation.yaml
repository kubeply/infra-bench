---
name: pr-validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # renovate: datasource=github-releases depName=oven-sh/bun
  BUN_VERSION: 1.3.10
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.11.25

jobs:
  actionlint:
    if: |
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install actionlint
        run: |
          set -euo pipefail
          : "${ACTIONLINT_VERSION:?ACTIONLINT_VERSION is required}"
          actionlint_version="${ACTIONLINT_VERSION#v}"
          case "$(uname -m)" in
            aarch64|arm64)
              actionlint_arch="arm64"
              ;;
            x86_64|amd64)
              actionlint_arch="amd64"
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSLo /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${actionlint_version}_linux_${actionlint_arch}.tar.gz"
          mkdir -p /tmp/actionlint
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint
          sudo install -m 0755 /tmp/actionlint/actionlint /usr/local/bin/actionlint

      - name: Validate GitHub Actions workflows
        run: actionlint

  dockerfile-lint:
    if: |
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: kubeply/rudolint@900cbb9bfd46590df20f033ed85d3c1fd1c76856 # v1.5.0
        with:
          config: .rudolint.yaml
          paths: |
            datasets
            docs/templates

  fast-checks:
    if: |
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install system lint dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends jq shellcheck

      - name: Validate file formatting and lint
        run: ./scripts/lint-files.sh

      - name: Validate task shell syntax
        run: |
          set -euo pipefail
          bash -n scripts/validate-structure.sh \
            datasets/kubernetes-core/*/environment/scripts/* \
            datasets/kubernetes-core/*/tests/*.sh \
            datasets/kubernetes-core/*/solution/solve.sh

      - name: Validate repository structure
        run: ./scripts/validate-structure.sh

      - name: Test benchmark result normalizer
        run: python3 scripts/test-benchmark-results-normalizer.py

      - name: Lint Kubernetes agent RBAC
        run: python3 scripts/lint-kubernetes-rbac.py

      - name: Verify dataset manifests are synchronized
        run: python3 scripts/check-dataset-manifests.py
